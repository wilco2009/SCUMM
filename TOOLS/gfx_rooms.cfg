# Ajustes por sala del conversor lfl2gfx.py. Una linea por sala:
#
#   sala: protect=x0,y0,x1,y1 protect=... tiles=N rarity=F
#
# protect  rectangulo en pixeles de la sala (0,0 arriba a la izquierda; las salas miden 128 de alto) cuyos tiles casi
#          no se funden: rotulos, personajes, objetos pequenos. Se pueden poner varios. En los PNG de preview/ sale
#          dibujado en magenta sobre la banda del original.
# keep     keep=C o keep=C,x0,y0,x1,y1: el color C de Chroma (0-15; 15 = blanco brillante) no se pierde en las filas de los
#          tiles de la zona (o de toda la sala): siempre es uno de los dos colores de cada fila. Para teclados, rotulos...
# tiles    presupuesto de tiles distintos por ventana (por defecto 216)
# rarity   peso de los colores raros de la sala (por defecto 0.5; 0 lo desactiva)
#
# Cuantos mas pixeles se protejan en una misma ventana de 33 columnas (264 pixeles), menos tiles quedan para el resto
# y mas se estropea lo no protegido: conviene proteger lo imprescindible.

4: protect=0,35,88,96 protect=130,60,260,127
26: protect=44,6,156,76      # mapa de la pared
27: protect=108,4,172,72     # cuadro
37: protect=418,0,558,54     # cuadro
43: keep=15                  # los dos teclados: el blanco de las cifras y simbolos es sagrado (no falta tiles, faltan colores por scanline)
