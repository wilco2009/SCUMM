# Perfil de juego: todo lo que cambia de un juego SCUMM v2 a otro y que el motor lee al arrancar (va dentro de DATA.BIN, ver TOOLS/gameprofile.py).
# El motor no contiene nada de esto. Zak McKracken (DOS, v2).

[interfaz]
# filas de texto de la pantalla del ZX81 (0-23): inventario (2 filas), verbos (3 filas) y frase
inventario_fila = 20
verbos_fila = 17
frase_fila = 16
# columna de un verbo en el bufer virtual de 40 columnas (la x de los scripts ya son columnas): columna = (x * mul + sum) >> desplaza ; fila = y - resta
columna_mul = 2
columna_sum = 0
columna_desplaza = 1
fila_resta = 2

[textos]
# etiquetas de los verbos: con la ventana virtual de 40 columnas se escribe el texto completo del verbo; aqui se pueden poner etiquetas cortas (verbo_N = TEXTO)
# preposiciones de la frase, en el orden de ScummVM (in, with, on, to)
prep_1 = " in"
prep_2 = " with"
prep_3 = " on"
prep_4 = " to"

[ficheros]
# nombre de los ficheros de sala en la SD; las dos cifras de la sala van donde estan los dos 00
sala = DATA/ROOM00.GFX
# sonidos: un fichero VGM del AY por sonido (TOOLS/sound2vgm.py); las tres cifras del sonido van donde estan los tres 000
sonido = DATA/SND/SOUND000.VGM

[teclas]
# teclas de digito del ZX81 (1-9, 0) -> valor que recibe VAR_KEYPRESS (zona 4). La tecla 9 es siempre ESC (salta la cutscene) en todos los juegos: no se define aqui.
1 = 1
2 = 2
3 = 3
4 = 4
# la tecla 8 es F5 (VAR_KEYPRESS = 5): los scripts del juego abren su menu de guardar y cargar
8 = 5


[trajes]
# escala de los personajes en la placa (numerador/denominador): 1/1 son 21-27 sprites por personaje. Con los 63 normales y los 15 extra de la FPGA
# (POKE 2131; ver actors.asm, ac_slot) caben 78 sprites: dos personajes enteros y parte de un tercero. A 3/4 eran ~14 y se perdian la cara y los detalles.
# Una lista (de mayor a menor): cada traje usa la primera escala en la que caben en su pagina sus detalles imprescindibles (el pelo y el sombrero del vendedor)
escala = 1/1,7/8,3/4
# Annie, Melissa y Leslie (trajes 2, 3 y 4) a 1/1 como Zak: con la lista de arriba sus detalles imprescindibles (el pelo, etc.) no caben en una pagina ni
# a 1/1 ni a 7/8, el traje bajaba a 3/4 y la mujer salia mas pequena que Zak (sala 6). A 1/1 sin ellos se anaden los fotogramas de overlay que quepan.
escala_2 = 1/1
escala_3 = 1/1
escala_4 = 1/1

[objetos]
# los ids 0..13 son actores y desde el 14 objetos (en Maniac Mansion: 25, el valor por omision)
actores = 14

[variables]
# valor inicial de VAR_MACHINE_SPEED (variable 6). ScummVM (resetScummVars de v2) lo pone a 0x7FFF en Zak: los scripts de la intro usan "Var[6] >= 40" para el camino elaborado,
# sincronizado con VAR_MUSIC_TIMER; con 0 salia el camino rapido, que acaba las escenas mucho antes que la musica y la intro se quedaba parada esperando a que acabase.
maquina = 0x7FFF

[scripts]
# startScript que no se arrancan si la sala actual es la indicada (script:sala, hasta 4 separados por comas). ScummVM (o2_startScript, _copyProtection falso por omision)
# no arranca el script 15 en la sala 45: es la rueda de codigos de los aeropuertos ("Traveler's Section... Enter code"), que exigiria tener el manual.
no_arrancar = 15:45
