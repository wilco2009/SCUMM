# Perfil de juego: todo lo que cambia de un juego SCUMM v2 a otro y que el motor lee al arrancar (va dentro de DATA.BIN, ver TOOLS/gameprofile.py).
# El motor no contiene nada de esto. Zak McKracken (DOS, v2).

[interfaz]
# filas de texto de la pantalla del ZX81 (0-23): inventario (2 filas), verbos (3 filas) y frase
inventario_fila = 20
verbos_fila = 17
frase_fila = 16
# posicion de un verbo en pantalla a partir de las coordenadas de sus scripts (320 x 200): columna = (x * mul + sum) >> desplaza ; fila = y - resta
columna_mul = 13
columna_sum = 4
columna_desplaza = 4
fila_resta = 2

[textos]
# etiquetas cortas de los verbos (id = texto); los demas verbos usan su nombre completo recortado
verbo_13 = WALK
verbo_14 = PICK
verbo_15 = WHAT
verbo_30 = TO ZAK
verbo_45 = SWITCH
verbo_4 = ON
verbo_5 = OFF
# preposiciones de la frase, en el orden de ScummVM (in, with, on, to)
prep_1 = " in"
prep_2 = " with"
prep_3 = " on"
prep_4 = " to"

[ficheros]
# nombre de los ficheros de sala en la SD; las dos cifras de la sala van donde estan los dos 00
sala = DATA/ROOM00.GFX
# sonidos: un fichero VGM del AY por sonido (TOOLS/sound2vgm.py); las tres cifras del sonido van donde estan los tres 000
sonido = DATA/SND/SOUND000.VGM

[teclas]
# teclas de digito del ZX81 (1-9, 0) -> valor que recibe VAR_KEYPRESS (zona 4). La tecla 9 es siempre ESC (salta la cutscene) en todos los juegos: no se define aqui.
1 = 1
2 = 2
3 = 3
4 = 4

[trajes]
# escala de los personajes en la placa (numerador/denominador): con 64 sprites hay que repartir ~21 por personaje
escala = 3/4
# el jefe (traje 32) es una figura sentada tras la mesa, no camina: a escala 1 queda a ras de la mesa y solo usa ~28 sprites
escala_32 = 1/1
